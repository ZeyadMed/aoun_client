name: aoun_client
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.3.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  geolocator: ^13.0.2
  get_it: ^9.2.1
  go_router: ^17.2.0
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.7.1
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  lottie: ^3.3.0
  path_provider: ^2.1.5
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  hive: ^2.2.3
  uuid: ^4.5.3
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/images/
    - assets/translations/
    - assets/fonts/
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Black.ttf
        - asset: assets/fonts/Alexandria-Bold.ttf
        - asset: assets/fonts/Alexandria-ExtraBold.ttf
        - asset: assets/fonts/Alexandria-ExtraLight.ttf
        - asset: assets/fonts/Alexandria-Light.ttf
        - asset: assets/fonts/Alexandria-Medium.ttf
        - asset: assets/fonts/Alexandria-Regular.ttf
        - asset: assets/fonts/Alexandria-SemiBold.ttf
        - asset: assets/fonts/Alexandria-Thin.ttf
        - asset: assets/fonts/Alexandria-VariableFont_wght.ttf
